<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nifty Signal">
<link rel="manifest" href="/manifest.json">
<title>Nifty Signal</title>
<style>
  :root {
    --bg: #0a0e14;
    --card: #141b22;
    --text: #e0e0e0;
    --text-dim: #6b7280;
    --green: #00c853;
    --red: #ff1744;
    --yellow: #ffc107;
    --blue: #448aff;
    --accent: #7c3aed;
    --border: #1e293b;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    padding: 16px 20px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .header .time { font-size: 12px; color: var(--text-dim); }
  .header .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .header .dot.live { background: var(--green); animation: pulse 2s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @keyframes alertGlow { 0%,100%{box-shadow:0 0 8px #ff174466} 50%{box-shadow:0 0 20px #ff1744aa} }
  @keyframes alertGlowGreen { 0%,100%{box-shadow:0 0 8px #00c85366} 50%{box-shadow:0 0 20px #00c853aa} }

  /* Signal Banner */
  .signal-banner {
    margin: 8px 16px;
    padding: 20px;
    border-radius: var(--radius);
    text-align: center;
    transition: all 0.3s ease;
  }
  .signal-banner.buy {
    background: linear-gradient(135deg, #00c85322, #00c85308);
    border: 1px solid #00c85344;
  }
  .signal-banner.wait {
    background: linear-gradient(135deg, #ffc10722, #ffc10708);
    border: 1px solid #ffc10744;
  }
  .signal-banner.exit {
    background: linear-gradient(135deg, #ff174422, #ff174408);
    border: 1px solid #ff174444;
  }
  .signal-banner .signal-icon { font-size: 48px; margin-bottom: 8px; }
  .signal-banner .signal-text { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .signal-banner .signal-sub { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

  /* Cards */
  .cards { padding: 8px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    border: 1px solid var(--border);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .card-header .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim); }
  .card-header .value { font-size: 13px; font-weight: 600; }

  /* Price Row */
  .price-row { display: flex; justify-content: space-between; align-items: baseline; }
  .price-row .big { font-size: 36px; font-weight: 800; letter-spacing: -1px; }
  .price-row .change { font-size: 14px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
  .price-row .change.up { background: #00c85322; color: #00c853; }
  .price-row .change.down { background: #ff174422; color: #ff1744; }

  /* Gauges */
  .gauge-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .gauge { text-align: center; }
  .gauge .g-value { font-size: 24px; font-weight: 700; }
  .gauge .g-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .gauge .g-sub { font-size: 10px; color: var(--text-dim); margin-top: 1px; }

  /* EMA bar */
  .ema-bar { margin-top: 8px; }
  .ema-bar .ema-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim); margin-bottom: 4px; }
  .ema-bar .ema-track { height: 6px; background: var(--border); border-radius: 3px; position: relative; }
  .ema-bar .ema-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
  .ema-bar .ema-fill.bull { background: var(--green); }
  .ema-bar .ema-fill.bear { background: var(--red); }
  .ema-bar .ema-marker {
    position: absolute; top: -4px; width: 14px; height: 14px;
    background: white; border-radius: 50%; border: 2px solid var(--bg);
    transform: translateX(-50%); transition: left 0.5s ease;
  }

  /* Regime Badge */
  .regime-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .regime-badge.sell_premium { background: #00c85322; color: #00c853; border: 1px solid #00c85344; }
  .regime-badge.defined_risk { background: #ffc10722; color: #ffc107; border: 1px solid #ffc10744; }
  .regime-badge.buy_directional { background: #448aff22; color: #448aff; border: 1px solid #448aff44; }

  /* Level indicators */
  .level-row { display: flex; gap: 8px; margin-top: 6px; }
  .level-pill {
    flex: 1; padding: 8px; border-radius: 10px; text-align: center;
    font-size: 11px; font-weight: 600;
  }
  .level-pill.target { background: #00c85315; color: #00c853; border: 1px solid #00c85333; }
  .level-pill.stop { background: #ff174415; color: #ff1744; border: 1px solid #ff174433; }

  .action-card {
    background: linear-gradient(135deg, var(--accent), #5b21b6);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 4px;
  }
  .action-card .action-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .action-card .action-text { font-size: 13px; line-height: 1.5; opacity: 0.9; }

  /* Footer */
  .footer {
    padding: 12px 20px;
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
  }

  .loading { text-align: center; padding: 40px; color: var(--text-dim); }
  .hidden { display: none !important; }

  /* Install prompt */
  .install-banner {
    background: var(--accent);
    color: white;
    padding: 12px 20px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }

  .tf-btn{background:#1e293b;border:1px solid #334155;color:#94a3b8;font-size:10px;padding:3px 10px;border-radius:6px;cursor:pointer;min-width:38px}
  .tf-btn.active{background:#0ea5e9;border-color:#0ea5e9;color:#fff;font-weight:700}
  .tf-btn:hover{background:#334155}

  /* Quick Nav — sticky section jumper */
  .quick-nav {
    position: sticky;
    top: 0;
    z-index: 999;
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    background: rgba(10, 13, 25, 0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid #1e293b;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    margin: 0 -12px 8px;
  }
  .quick-nav::-webkit-scrollbar { display: none; }
  .qnav-chip {
    flex: 0 0 auto;
    background: #1e293b;
    border: 1px solid #334155;
    color: #94a3b8;
    font-size: 11px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .qnav-chip:active { transform: scale(0.94); }
  .qnav-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 12px rgba(124,58,237,0.45);
  }
  .card { scroll-margin-top: 58px; }

.strat-grid{display:flex;flex-direction:column;gap:6px}
.strat-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 8px;background:rgba(30,41,59,.35);border-radius:8px;border-left:3px solid #64748b;min-width:0}
.strat-name{font-weight:700;white-space:nowrap;min-width:92px;flex-shrink:0}
.strat-state{font-weight:700;white-space:nowrap;padding:1px 8px;border-radius:10px;font-size:11px;flex-shrink:0}
.strat-reason{color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.strat-ok{background:#00c85322;color:#00c853}
.strat-bad{background:#ff174422;color:#ff1744}
.strat-wait{background:#ffab0044;color:#ffab00}
.strat-off{background:#64748b33;color:#94a3b8}
</style>
</head>
